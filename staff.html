<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បុគ្គលិក - Staff Check-In</title>
    <!-- Web App Manifest for Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Staff CheckIn">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Style for QR Scanner camera box to look premium */
        #qr-reader video {
            border-radius: 1rem;
            object-fit: cover !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- Container Area -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        
        <!-- Login Screen Section -->
        <div id="loginSection" class="p-6 sm:p-8 hidden">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-inner">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">ចូលប្រើប្រាស់ប្រព័ន្ធ</h2>
                <p class="text-sm text-slate-500 mt-1">សូមបញ្ចូលគណនីដែលផ្តល់ដោយប្រធានគ្រប់គ្រង</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">អ៊ីមែល</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="loginEmail" required class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">លេខកូដសម្ងាត់</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="loginPassword" required class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <button type="submit" id="loginSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-md shadow-indigo-100 text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> <span>ឡុកអ៊ិនចូលគណនី</span>
                </button>
            </form>
            <div id="loginError" class="mt-4 text-xs p-3 bg-rose-50 text-rose-600 rounded-xl hidden"></div>
        </div>

        <!-- Main Dashboard / Action Screen -->
        <div id="mainSection" class="hidden">
            <!-- App Header -->
            <div class="bg-indigo-900 p-6 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-800 rounded-xl flex items-center justify-center text-indigo-200">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <div>
                        <h3 id="userName" class="font-bold text-sm">...</h3>
                        <p class="text-xs text-indigo-200">បុគ្គលិកក្រុមហ៊ុន</p>
                    </div>
                </div>
                <button id="logoutBtn" class="text-indigo-300 hover:text-white p-2 rounded-lg hover:bg-indigo-800 transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>

            <!-- Content Area -->
            <div class="p-6 space-y-6">
                <!-- Status Box -->
                <div id="statusBox" class="p-5 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col items-center text-center">
                    <div id="statusIcon" class="w-14 h-14 bg-slate-200 text-slate-600 rounded-full flex items-center justify-center text-xl mb-3">
                        <i class="fa-solid fa-hourglass-middle"></i>
                    </div>
                    <h4 id="statusTitle" class="font-bold text-slate-900">កំពុងផ្ទៀងផ្ទាត់...</h4>
                    <p id="statusDesc" class="text-xs text-slate-500 mt-1">សូមរង់ចាំប្រព័ន្ធត្រួតពិនិត្យការស្កែន</p>
                </div>

                <!-- Camera Scanner Container (Hidden by default) -->
                <div id="scannerWrapper" class="hidden space-y-3">
                    <div class="relative overflow-hidden rounded-2xl border border-slate-200 bg-black">
                        <div id="qr-reader" class="w-full"></div>
                    </div>
                    <button id="stopScanBtn" class="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl text-xs transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-camera-rotate"></i> បិទកាមេរ៉ាវិញ
                    </button>
                </div>

                <!-- Action Button Options -->
                <div class="space-y-3" id="actionButtons">
                    <!-- Scan Button -->
                    <button id="startScanBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl text-sm transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-qrcode text-lg"></i> បើកកាមេរ៉ាស្កែន QR Code
                    </button>

                    <!-- Manual Fallback Button (Optional for Admin debug) -->
                    <button id="manualCheckBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-xs transition hidden shadow-lg shadow-emerald-100 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-fingerprint"></i> ចុចកត់ត្រាវត្តមានផ្ទាល់ (Manual)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCVzRdVej7MORKTa-NcQMHJEzQ1nYikZX0",
            authDomain: "chafe-app.firebaseapp.com",
            projectId: "chafe-app",
            storageBucket: "chafe-app.firebasestorage.app",
            messagingSenderId: "43410802507",
            appId: "1:43410802507:web:c48c2d946b89008c34cace",
            measurementId: "G-J1M1DS7502"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('loginSection');
        const mainSection = document.getElementById('mainSection');
        const startScanBtn = document.getElementById('startScanBtn');
        const stopScanBtn = document.getElementById('stopScanBtn');
        const scannerWrapper = document.getElementById('scannerWrapper');
        const actionButtons = document.getElementById('actionButtons');
        
        let currentUserData = null;
        let html5QrcodeScanner = null;

        // ពិនិត្យស្ថានភាព Login ជាប់ជានិច្ច
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        currentUserData = userDoc.data();
                        document.getElementById('userName').innerText = currentUserData.name;
                        
                        loginSection.classList.add('hidden');
                        mainSection.classList.remove('hidden');

                        // ពិនិត្យថាតើបុគ្គលិកបើកតាមរយៈការស្កែនពីក្រៅ (URL params) ដែរឬទេ
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('action') === 'scan') {
                            executeCheckIn();
                        } else {
                            setUINormalState();
                        }
                    } else {
                        document.getElementById('userName').innerText = "គណនីគ្មានឈ្មោះ";
                        loginSection.classList.add('hidden');
                        mainSection.classList.remove('hidden');
                        updateStatusUI('error', 'រកមិនឃើញទិន្នន័យ', 'គណនីនេះត្រូវបានបង្កើតក្នុង Auth ប៉ុន្តែរកមិនឃើញឈ្មោះក្នុង Database ទេ។ សូមទាក់ទង Admin!');
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                    alert("មានបញ្ហាក្នុងការទាញយកទិន្នន័យ៖ " + error.message);
                }
            } else {
                mainSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
                stopCameraScanner(); // បិទកាមេរ៉ា បើចាកចេញ
            }
        });

        // មុខងារបើកកាមេរ៉ាស្កែននៅក្នុង App
        startScanBtn.addEventListener('click', () => {
            actionButtons.classList.add('hidden');
            scannerWrapper.classList.remove('hidden');
            updateStatusUI('normal', 'កំពុងបើកកាមេរ៉ា', 'សូមដាក់ QR Code ឱ្យចំប្រអប់កាមេរ៉ាដើម្បីស្កែន');

            // កំណត់ទំហំ និងកាមេរ៉ាក្រោយ (Environment)
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("កាមេរ៉ាមានបញ្ហា៖", err);
                updateStatusUI('error', 'មិនអាចបើកកាមេរ៉ាបានទេ', 'សូមអនុញ្ញាត (Allow) ឱ្យ App ប្រើប្រាស់កាមេរ៉ា ឬបើកតាមកម្មវិធីស្កែនទូទៅ។');
                stopCameraScanner();
            });
        });

        // មុខងារបិទកាមេរ៉ាវិញ
        stopScanBtn.addEventListener('click', () => {
            stopCameraScanner();
            setUINormalState();
        });

        function stopCameraScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner = null;
                }).catch(err => console.error(err));
            }
            scannerWrapper.classList.add('hidden');
            actionButtons.classList.remove('hidden');
        }

        // ពេលស្កែន QR ត្រូវ (ជោគជ័យ)
        function onScanSuccess(decodedText, decodedResult) {
            // ពិនិត្យមើលថាតើ QR ដែលស្កែននោះមានផ្ទុកពាក្យគន្លឹះត្រឹមត្រូវឬទេ
            if (decodedText.includes('action=scan') || decodedText.includes('staff.html')) {
                stopCameraScanner();
                executeCheckIn();
            } else {
                // ប្រសិនបើស្កែនត្រូវ QR ផ្សេងដែលមិនមែនរបស់ក្រុមហ៊ុន
                updateStatusUI('error', 'QR Code មិនត្រឹមត្រូវ', 'QR Code នេះមិនមែនជា QR សម្រាប់កត់ត្រាវត្តមានការងារឡើយ!');
                setTimeout(() => {
                    updateStatusUI('normal', 'កំពុងស្កែន...', 'សូមសាកល្បងស្កែន QR Code ក្រុមហ៊ុនឡើងវិញ');
                }, 3000);
            }
        }

        function onScanFailure(error) {
            // មិនបាច់បង្ហាញកំហុសរាល់វិនាទីទេ ព្រោះវាកំពុងចាប់រូបភាពស្កែនជាប់ជានិច្ច
        }

        // Login Form Event
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errBox = document.getElementById('loginError');
            const submitBtn = document.getElementById('loginSubmitBtn');
            
            try {
                errBox.classList.add('hidden');
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> កំពុងផ្ទៀងផ្ទាត់...`;
                
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errBox.classList.remove('hidden');
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> អ៊ីមែល ឬលេខកូដសម្ងាត់មិនត្រឹមត្រូវឡើយ!`;
                } else if (error.code === 'auth/network-request-failed') {
                    errBox.innerHTML = `<i class="fa-solid fa-wifi"></i> គ្មានការតភ្ជាប់អ៊ីនធឺណិតទេ!`;
                } else {
                    errBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> កំហុស៖ ${error.message}`;
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>ឡុកអ៊ិនចូលគណនី</span>`;
            }
        });

        // មុខងារចាកចេញពីប្រព័ន្ធ
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.reload();
            });
        });

        // មុខងារកំណត់ UI ពេលមិនទាន់បានស្កែន
        function setUINormalState() {
            updateStatusUI('normal', 'ត្រៀមខ្លួនរួចរាល់', 'សូមចុចប៊ូតុងខាងក្រោមដើម្បីស្កែន QR Code រួម ឬកត់ត្រាវត្តមានការងារ។');
            const manualBtn = document.getElementById('manualCheckBtn');
            manualBtn.classList.remove('hidden');
            manualBtn.classList.add('flex');
            manualBtn.onclick = () => executeCheckIn();
        }

        // មុខងារចម្បង៖ កត់ត្រាចូលការងារ និង Alert ទៅ Telegram
        async function executeCheckIn() {
            updateStatusUI('loading', 'កំពុងរក្សាទុក...', 'ប្រព័ន្ធកំពុងកត់ត្រាវត្តមានរបស់អ្នក...');
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('km-KH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('km-KH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            try {
                if (!currentUserData) {
                    throw new Error("រកមិនឃើញព័ត៌មានបុគ្គលិកឡើយ");
                }

                // ១. រក្សាទុកប្រវត្តិក្នុង Firebase Firestore
                await addDoc(collection(db, "attendance"), {
                    userId: currentUserData.uid,
                    name: currentUserData.name,
                    email: currentUserData.email,
                    timestamp: now.toISOString(),
                    date: dateStr,
                    time: timeStr
                });

                // ២. ទាញយក Telegram Token & Chat ID ពី Firestore Settings
                const tgDoc = await getDoc(doc(db, "settings", "telegram"));
                if (tgDoc.exists()) {
                    const tgData = tgDoc.data();
                    const botToken = tgData.botToken;
                    const chatId = tgData.chatId;

                    if (botToken && chatId) {
                        const message = `🔔 *វត្តមានបុគ្គលិក*\n\n👤 ឈ្មោះ: ${currentUserData.name}\n📧 អ៊ីមែល: ${currentUserData.email}\n📅 កាលបរិច្ឆេទ: ${dateStr}\n⏰ ម៉ោងស្កែន: ${timeStr}\n🟢 ស្ថានភាព: ចូលការងារជោគជ័យ`;
                        
                        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                text: message,
                                parse_mode: 'Markdown'
                            })
                        });
                    }
                }

                // ប្តូរ UI បង្ហាញភាពជោគជ័យ
                updateStatusUI('success', 'Check-In ជោគជ័យ', `ម៉ោងចូលការងារ៖ ${timeStr}`);
                
                // លុប Action parameters ពី URL កុំអោយវាស្កែនឌុបពេល Refresh ទំព័រ
                window.history.replaceState({}, document.title, window.location.pathname);

            } catch (error) {
                console.error("Check-in error:", error);
                updateStatusUI('error', 'មានបញ្ហាខុសឆ្គង', 'មិនអាចកត់ត្រាវត្តមានបានទេ៖ ' + error.message);
            }
        }

        // Helper function សម្រាប់ប្តូរ interface មើលទៅស្អាត
        function updateStatusUI(type, title, desc) {
            const iconBox = document.getElementById('statusIcon');
            const titleBox = document.getElementById('statusTitle');
            const descBox = document.getElementById('statusDesc');

            titleBox.innerText = title;
            descBox.innerText = desc;

            if (type === 'loading') {
                iconBox.className = "w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-xl mb-3 animate-pulse";
                iconBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            } else if (type === 'success') {
                iconBox.className = "w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-xl mb-3 shadow-md shadow-emerald-50";
                iconBox.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
            } else if (type === 'error') {
                iconBox.className = "w-14 h-14 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center text-xl mb-3";
                iconBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
            } else {
                iconBox.className = "w-14 h-14 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center text-xl mb-3";
                iconBox.innerHTML = `<i class="fa-solid fa-qrcode"></i>`;
            }
        }
    </script>
</body>
</html>
